name: Qube checks and installers
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "README.md"]
  pull_request:
    paths-ignore: ["docs/**", "README.md"]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @qube/protocol
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: python3 -m pip install fastapi==0.118.0 httpx==0.28.1
      - run: python3 -m unittest discover -s services/speech -v
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - run: npm ci
      - run: dotnet publish apps/windows/native/Qube.Native.csproj -c Release -r win-x64 --self-contained true -o apps/windows/native/publish
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Qube-Windows-x64-preview
          path: apps/windows/release/*.exe
          if-no-files-found: error
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: python3 scripts/fetch-android-assets.py
      - run: gradle -p apps/android testDebugUnitTest assembleDebug lintDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Qube-Android-arm64-preview
          path: apps/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
